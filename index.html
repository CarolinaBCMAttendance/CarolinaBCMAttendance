<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCM Group Attendance</title>
    <link rel   = "icon"
          href  = "favicon.png"
          sizes = "64x64"
          type  = "image/x-icon">
    <link rel   = "stylesheet"
          href  = "index.css">
  </head>
  <body class = "page-layout">
    <div class = "page-layout_banner">
      <img class = "page-layout_banner-logo"
           src = "BCM+72+ppi+.webp"
           alt = "BCM Group logo">
      <h1>BCM GROUP<br>ATTENDANCE</h1>
    </div>
    <div class = "page-layout_prompt">
      <h1>Select Your Group</h1>
      <h2>Start typing</h2>
      <button class      = "new_button">
        ADD NEW
        </button>
      <button class      = "submit_button">
        SUBMIT
        </button>
      <input type        = "text"
             placeholder = "Type a group leaders&#39; name">
    </div>
    <div class   = "page-layout_members">
    </div>
    <div class   = "page-layout_table"></div>
    <div class   = "page-layout_footer">
      <button class = "back_button"
              type  = "button">
        RESET
      </button>
    </div>
    <script type = "module"
            src  = "index.js">
    </script>
</body>
</html>
